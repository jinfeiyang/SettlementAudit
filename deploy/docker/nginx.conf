# 前端入口：静态资源 + /api 反向代理（容器云对外仅暴露本服务 80 端口）
# 服务名 preaudit-backend 由同命名空间内的 Service 提供
user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'upstream_status=$upstream_status rt=$request_time';
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;

    # 与后端 multipart 上限（100MB 单文件 / 200MB 请求）对齐
    client_max_body_size 200m;
    client_body_timeout  300s;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # 平台存活/就绪探针
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 后端接口：运行时解析服务名，避免 Pod IP 变更后连接缓存失效
        location /api/ {
            resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
            set $backend "preaudit-backend:8080";
            proxy_pass         http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            # 核查/图纸解析为长请求（后端异步 + 轮询，仍留足余量）
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering       off;
        }

        # 前端路由（history 模式）
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # 带 hash 的静态资源可长缓存
        location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
