# 前端入口：80 端口，静态资源 + /api 反代到 preaudit-backend
# 对外服务（域名 + HTTP 80）在平台「服务 → 对外服务」中配置，见 deploy/README.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preaudit-web
  namespace: zjbase-bmo
  labels:
    app: preaudit-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preaudit-web
  template:
    metadata:
      labels:
        app: preaudit-web
    spec:
      containers:
        - name: web
          image: 130.36.8.236:8443/<项目>/preaudit-web:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: preaudit-web
  namespace: zjbase-bmo
spec:
  type: ClusterIP               # 对外由平台「对外服务」+ 全局负载均衡接管
  selector:
    app: preaudit-web
  ports:
    - name: http
      port: 80
      targetPort: 80
